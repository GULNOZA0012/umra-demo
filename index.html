<!DOCTYPE html>
<html lang="uz" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>IHLOS Umra</title>
<style>
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --surface2:#F1EBDC; --ink:#1C2B26; --mute:#6D7C75;
  --em:#0E7C61; --em-deep:#0A5C49; --teal:#2BB3A3; --gold:#C39A3F; --gold-soft:#F3E7C4;
  --line:rgba(14,124,97,.14); --shadow:0 10px 30px rgba(20,60,48,.08); --danger:#C8553D; --ok:#1E9E6E;
  --hero1:#0E7C61; --hero2:#1B9A80; --hero3:#35B8A6; --pat:rgba(14,124,97,.07);
  --r:24px; --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
}
[data-theme=dark]{
  --bg:#0B1D18; --surface:#122A23; --surface2:#18362D; --ink:#EEF3EC; --mute:#9CB2A8;
  --em:#41C7A2; --em-deep:#2FA787; --teal:#56D3C3; --gold:#E3C374; --gold-soft:#3A3421;
  --line:rgba(255,255,255,.09); --shadow:0 10px 30px rgba(0,0,0,.35); --danger:#F08A73; --ok:#5FD39A;
  --hero1:#0B4F3F; --hero2:#0F6A55; --hero3:#17877A; --pat:rgba(255,255,255,.035);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
h1,h2,h3{font-family:var(--serif);margin:0;font-weight:700;letter-spacing:.1px}
button{font-family:inherit}
#app{max-width:520px;margin:0 auto;padding:0 16px calc(120px + env(safe-area-inset-bottom))}

.demo-bar{margin:calc(8px + env(safe-area-inset-top)) 0 0;padding:8px 12px;border-radius:12px;background:var(--gold-soft);color:#7A5C14;font:600 12px system-ui;text-align:center}
[data-theme=dark] .demo-bar{color:var(--gold)}
/* header */
.top{display:flex;align-items:center;gap:12px;padding:12px 2px 12px}
.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(145deg,var(--hero1),var(--hero3));display:grid;place-items:center;box-shadow:var(--shadow)}
.brand b{display:block;font:700 17px var(--serif);line-height:1.1}
.brand small{font-size:11px;letter-spacing:2.2px;text-transform:uppercase;color:var(--gold);font-weight:700}
.icon-btn{margin-left:auto;width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--em);display:grid;place-items:center;cursor:pointer}
.icon-btn svg,.nav svg,.qa svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* views */
.view{display:none}
.view.on{display:block}
.view.on>*{animation:up .5s cubic-bezier(.2,.8,.2,1) both}
.view.on>*:nth-child(2){animation-delay:.05s}.view.on>*:nth-child(3){animation-delay:.1s}.view.on>*:nth-child(4){animation-delay:.15s}.view.on>*:nth-child(5){animation-delay:.2s}.view.on>*:nth-child(n+6){animation-delay:.25s}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:32px;padding:22px 20px 20px;color:#fff;background:linear-gradient(155deg,var(--hero1),var(--hero2) 55%,var(--hero3));box-shadow:0 18px 40px rgba(14,124,97,.28)}
.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(420px 260px at 85% 0%,rgba(255,255,255,.22),transparent 70%)}
.hero>*{position:relative}
.hero .art{position:absolute;right:14px;top:16px;width:140px;height:180px;border-radius:999px 999px 22px 22px;overflow:hidden;border:3px solid rgba(255,255,255,.7);box-shadow:0 12px 28px rgba(0,0,0,.28),0 0 0 6px rgba(255,255,255,.12);background:#0b2a22}
.hero .art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 45%;transition:opacity .4s}
.hero .art .night{opacity:0}
[data-theme=dark] .hero .art .night{opacity:1}
.tag{display:inline-flex;align-items:center;gap:6px;font:700 11px system-ui;letter-spacing:1.6px;text-transform:uppercase;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);padding:6px 10px;border-radius:99px}
.hero h1{font-size:28px;line-height:1.14;margin:16px 0 8px;max-width:54%;min-height:96px}
.hero p{margin:0;font-size:14px;opacity:.92;max-width:54%}
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:20px 0 16px}
.cd div{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:16px;text-align:center;padding:10px 0;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.cd b{display:block;font:700 24px var(--serif);font-variant-numeric:tabular-nums}
.cd span{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;opacity:.85}
.cta{appearance:none;border:0;width:100%;padding:15px;border-radius:18px;font:700 16px system-ui;cursor:pointer;background:#fff;color:#0A5C49;box-shadow:0 8px 20px rgba(0,0,0,.14);transition:transform .15s}
.cta:active,.btn:active,.qa:active{transform:scale(.97)}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-top:14px;box-shadow:var(--shadow);transition:background .3s}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.mute{color:var(--mute);font-size:13.5px}
h2{font-size:24px;margin:8px 2px 2px}
h3{font-size:17px}
.sec{display:flex;align-items:center;gap:10px;margin:26px 2px 0}
.sec:before{content:"";width:10px;height:10px;background:var(--gold);transform:rotate(45deg);border-radius:2px;flex:none}
.sec h3{font-size:18px}

.seats{display:flex;align-items:center;gap:16px}
.ring{position:relative;width:76px;height:76px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:700 22px var(--serif);color:var(--em)}
.ring circle{fill:none;stroke-width:7;stroke-linecap:round}
.ring .t{stroke:var(--surface2)}.ring .p{stroke:var(--gold);transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1)}

.qgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.qa{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:14px 4px 10px;text-align:center;cursor:pointer;color:var(--ink);font:600 12px system-ui;box-shadow:var(--shadow);transition:transform .15s}
.qa i{display:grid;place-items:center;width:44px;height:44px;margin:0 auto 8px;border-radius:14px;color:var(--em);background:color-mix(in srgb,var(--em) 12%,transparent)}
.qa:nth-child(2) i{color:var(--gold);background:color-mix(in srgb,var(--gold) 16%,transparent)}
.qa:nth-child(3) i{color:var(--teal);background:color-mix(in srgb,var(--teal) 16%,transparent)}

ul.list{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:10px}
ul.list li{display:flex;gap:12px;align-items:flex-start;font-size:15px}
ul.list li:before{content:"";flex:none;width:9px;height:9px;margin-top:7px;background:var(--gold);transform:rotate(45deg);border-radius:2px}
ol.num{list-style:none;margin:12px 0 0;padding:0;counter-reset:n;display:grid;gap:8px}
ol.num li{counter-increment:n;display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:16px;background:var(--surface2);font-size:15px}
ol.num li:before{content:counter(n);flex:none;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font:700 14px var(--serif);color:#fff;background:linear-gradient(145deg,var(--hero1),var(--hero3))}

/* prayer */
.pt{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px}
.pt div{border-radius:16px;padding:10px 2px;text-align:center;background:var(--surface2)}
.pt b{display:block;font-size:15px;font-variant-numeric:tabular-nums}
.pt span{font-size:11px;color:var(--mute)}
.pt .next{background:linear-gradient(155deg,var(--hero1),var(--hero3));color:#fff}
.pt .next span{color:rgba(255,255,255,.85)}

/* boarding pass */
.pass{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-top:14px;box-shadow:var(--shadow);overflow:hidden}
.pass .in{padding:18px}
.pass .cut{border-top:2px dashed var(--line);margin:0 18px;position:relative}
.pass .cut:before,.pass .cut:after{content:"";position:absolute;top:-11px;width:20px;height:20px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.pass .cut:before{left:-29px}.pass .cut:after{right:-29px}
.fl{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.fl b{font:700 30px var(--serif);display:block;line-height:1}
.fl .r{text-align:right}
.fl .mid{color:var(--gold);display:flex;align-items:center;gap:6px;font-size:18px}
.fl .mid:before,.fl .mid:after{content:"";width:26px;border-top:2px dotted var(--gold)}
.pill{display:inline-block;font:700 11px system-ui;letter-spacing:.6px;padding:5px 10px;border-radius:99px;background:var(--gold-soft);color:var(--gold)}
[data-theme=light] .pill{color:#8A6A1D}

.tabs{display:flex;gap:4px;background:var(--surface2);padding:4px;border-radius:16px;margin-top:16px}
.tabs button{flex:1;border:0;background:none;color:var(--mute);font:600 14px system-ui;padding:10px 4px;border-radius:12px;cursor:pointer;transition:.2s}
.tabs button.on{background:var(--surface);color:var(--em);box-shadow:0 2px 8px rgba(0,0,0,.08)}

/* forms */
label{display:block;font:600 13px system-ui;color:var(--mute);margin:16px 0 6px}
label:first-child{margin-top:0}
input,select{width:100%;background:var(--surface2);border:1.5px solid transparent;color:var(--ink);padding:14px;border-radius:16px;font:16px system-ui;outline:none;transition:border .2s}
input:focus,select:focus{border-color:var(--em)}
.btn{appearance:none;border:0;cursor:pointer;width:100%;padding:15px;border-radius:18px;font:700 16px system-ui;color:#fff;background:linear-gradient(145deg,var(--hero1),var(--hero3));box-shadow:0 10px 22px rgba(14,124,97,.25);transition:transform .15s;margin-top:16px}
.btn.ghost{background:var(--surface);color:var(--em);border:1.5px solid var(--line);box-shadow:none}
.btn.sm{width:auto;padding:9px 14px;font-size:13px;border-radius:12px;margin:0}
a.btn{display:block;text-align:center;text-decoration:none}
.err{color:var(--danger);font-size:13.5px;min-height:20px;margin:10px 0 0}
.steps{display:flex;gap:6px;margin:14px 2px 0}
.steps i{flex:1;height:5px;border-radius:9px;background:var(--surface2);transition:.3s}
.steps i.on{background:linear-gradient(90deg,var(--em),var(--teal))}
.counter{display:flex;align-items:center;gap:16px}
.counter button{width:50px;height:50px;border-radius:16px;border:0;background:var(--surface2);color:var(--em);font:700 24px system-ui;cursor:pointer}
.counter b{font:700 30px var(--serif);min-width:36px;text-align:center}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opts button{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:16px;padding:14px 4px;font:600 14px system-ui;cursor:pointer;transition:.2s}
.opts button.on{border-color:var(--em);background:color-mix(in srgb,var(--em) 10%,var(--surface));color:var(--em)}
.sum{display:grid;gap:10px;margin:0}
.sum div{display:flex;justify-content:space-between;gap:12px;padding-bottom:10px;border-bottom:1px dashed var(--line)}
.sum div:last-child{border:0;padding:0}
.sum span{color:var(--mute)}
.big-ref{font:700 34px var(--serif);letter-spacing:3px;color:var(--em);text-align:center;margin:10px 0}
.okmark{width:72px;height:72px;border-radius:50%;margin:6px auto 12px;display:grid;place-items:center;background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok);font-size:34px;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}}

/* tasbeh */
.zikr{display:flex;gap:8px;overflow:auto;padding:2px;margin-top:12px;scrollbar-width:none}
.zikr button{flex:none;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:8px 14px;font:600 13px system-ui;cursor:pointer}
.zikr button.on{background:var(--em);border-color:var(--em);color:#fff}
[data-theme=dark] .zikr button.on{color:#06231b}
.tasbeh{position:relative;width:210px;height:210px;margin:18px auto 6px}
.tasbeh svg{position:absolute;inset:0;transform:rotate(-90deg)}
.tasbeh circle{fill:none;stroke-width:9;stroke-linecap:round}
.tasbeh .t{stroke:var(--surface2)}.tasbeh .p{stroke:var(--gold);transition:stroke-dashoffset .25s}
.tasbeh button{position:absolute;inset:20px;border-radius:50%;border:0;cursor:pointer;color:#fff;background:radial-gradient(circle at 30% 25%,var(--hero3),var(--hero1));box-shadow:0 14px 30px rgba(14,124,97,.35),inset 0 2px 0 rgba(255,255,255,.25);transition:transform .08s}
.tasbeh button:active{transform:scale(.95)}
.tasbeh button b{display:block;font:700 54px var(--serif);line-height:1;font-variant-numeric:tabular-nums}
.tasbeh button span{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;opacity:.85}
.check{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.check:last-child{border:0;padding-bottom:0}
.box{flex:none;width:26px;height:26px;border-radius:9px;border:2px solid var(--em);display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px;transition:.2s}
.check.done .box{background:var(--em)}
.check.done span{color:var(--mute);text-decoration:line-through}
.meter{height:8px;border-radius:9px;background:var(--surface2);overflow:hidden;margin:10px 0 4px}
.meter i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--em),var(--teal));transition:width .5s}
.arabic{font:700 22px/1.9 "Geeza Pro","Noto Naskh Arabic","Traditional Arabic",serif;direction:rtl;text-align:center;color:var(--em);margin:8px 0}

/* status */
.track{display:flex;align-items:center;margin-top:16px}
.track .n{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:700 13px system-ui;background:var(--surface2);color:var(--mute)}
.track .l{flex:1;height:3px;background:var(--surface2)}
.track .n.on{background:var(--em);color:#fff}.track .l.on{background:var(--em)}
.tl{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mute);margin-top:6px}
.app{padding:14px 0;border-bottom:1px solid var(--line)}
.app:last-child{border:0;padding-bottom:0}
.app select{width:auto;padding:8px 10px;font-size:13px;border-radius:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px 6px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font:700 24px var(--serif);color:var(--em)}
.stat span{font-size:11.5px;color:var(--mute)}
.empty{text-align:center;padding:30px 10px}
.link{background:none;border:0;color:var(--em);font:600 14px system-ui;cursor:pointer;padding:0}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;padding:0 14px calc(12px + env(safe-area-inset-bottom));pointer-events:none;transition:bottom .25s}
.nav .bar{pointer-events:auto;width:100%;max-width:492px;display:grid;grid-template-columns:1fr 1fr 76px 1fr 1fr;align-items:center;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:26px;padding:6px;box-shadow:0 12px 34px rgba(20,60,48,.16)}
.nav button{background:none;border:0;color:var(--mute);padding:8px 0 6px;border-radius:18px;font:600 10.5px system-ui;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;transition:color .2s}
.nav button.on{color:var(--em)}
.nav button.on svg{stroke-width:2.3}
.nav .fab{width:58px;height:58px;margin:-26px auto 0;border-radius:22px;color:#fff;background:linear-gradient(145deg,var(--gold),#E0B95C);box-shadow:0 10px 24px rgba(195,154,63,.45);justify-content:center;transform:rotate(45deg);padding:0}
.nav .fab svg{transform:rotate(-45deg);width:26px;height:26px;stroke-width:2.2}
.nav .fab.on{color:#fff}
.in-tg.mb-on .nav{bottom:-120px}
.in-tg .web-only{display:none}
.note{font-size:12px;color:var(--mute);text-align:center;margin:22px 0 0}
.toast{position:fixed;left:50%;bottom:120px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);font:600 14px system-ui;padding:12px 18px;border-radius:16px;opacity:0;pointer-events:none;transition:.3s;z-index:50;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ---- rejim almashtirgich va agent paneli ---- */
.mode{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface2);padding:4px;border-radius:16px;margin:10px 0 0}
.mode button{border:0;background:none;color:var(--mute);font:700 14px system-ui;padding:11px 6px;border-radius:12px;cursor:pointer;transition:.2s}
.mode button.on{background:var(--surface);color:var(--em);box-shadow:0 2px 8px rgba(0,0,0,.1)}
body.adm #nav-u{display:none}
body:not(.adm) #nav-a{display:none}
#nav-a .bar{grid-template-columns:repeat(5,1fr)}
.nav button{position:relative}
.badge{position:absolute;top:0;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--danger);color:#fff;font:700 11px system-ui;display:grid;place-items:center;padding:0 5px}
textarea{width:100%;background:var(--surface2);border:1.5px solid transparent;color:var(--ink);padding:14px;border-radius:16px;font:16px/1.45 system-ui;outline:none;min-height:120px;resize:vertical;transition:border .2s}
textarea:focus{border-color:var(--em)}
code{background:var(--surface2);padding:1px 6px;border-radius:6px;font-size:12.5px}
.chips{display:flex;gap:8px;overflow:auto;margin-top:12px;padding:2px;scrollbar-width:none}
.chips button{flex:none;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:8px 14px;font:600 13px system-ui;cursor:pointer}
.chips button.on{background:var(--em);border-color:var(--em);color:#fff}
[data-theme=dark] .chips button.on{color:#06231b}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:var(--shadow)}
.kpi span{font-size:12.5px;color:var(--mute);display:block}
.kpi b{display:block;font:700 26px var(--serif);color:var(--em);line-height:1.2;margin-top:2px}
.kpi small{font-size:12.5px;color:var(--mute)}
.todo{display:flex;gap:12px;align-items:center;width:100%;padding:12px 0;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);text-align:left;font:15px/1.35 system-ui;cursor:pointer}
.todo:last-child{border-bottom:0;padding-bottom:0}
.todo i{flex:none;min-width:32px;height:32px;padding:0 8px;border-radius:11px;display:grid;place-items:center;font:700 15px var(--serif);font-style:normal;color:#fff;background:var(--gold)}
.todo i.g{background:var(--em)}.todo i.r{background:var(--danger)}
.fun{display:grid;gap:12px}
.fun>div{display:grid;grid-template-columns:92px 1fr 28px;gap:10px;align-items:center;font-size:14px}
.fun .bar{display:block;height:12px;border-radius:9px;background:var(--surface2);overflow:hidden}
.fun .bar i{display:block;height:100%;border-radius:9px;transition:width .5s}
.fun b{text-align:right}
.tgmsg{background:#E6F4EE;border-radius:6px 18px 18px 18px;padding:12px 14px;font-size:14.5px;line-height:1.55;color:#12372d;margin-top:12px}
[data-theme=dark] .tgmsg{background:#1B3A31;color:#EEF3EC}
.tgbtns{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.tgbtns span{text-align:center;padding:9px 4px;border-radius:10px;background:rgba(14,124,97,.14);color:var(--em);font:600 13px system-ui}
.acard{border:1px solid var(--line);border-radius:20px;padding:14px;margin-top:10px;background:var(--surface);box-shadow:var(--shadow)}
.acard.open{border-color:var(--em)}
.dots{display:flex;gap:5px}.dots i{width:22px;height:8px;border-radius:6px;background:var(--surface2)}.dots i.on{background:var(--ok)}
.pill.s-Tasdiqlandi{background:color-mix(in srgb,var(--teal) 18%,transparent);color:var(--em)}
.pill.s-Tolandi{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.pill.s-Bekor{background:color-mix(in srgb,var(--danger) 16%,transparent);color:var(--danger)}
.opts button small{display:block;font-size:12px;font-weight:600;opacity:.8;margin-top:2px}

  '<div class="sec"><h3>Qancha vaqt tejaladi?</h3></div><div class="card" style="margin-top:10px"><label for="roi-w">Haftasiga nechta murojaat keladi?</label><input id="roi-w" type="number" min="0" inputmode="numeric" value="'+roi.w+'"><label for="roi-m">Har biriga necha daqiqa ketadi?</label><input id="roi-m" type="number" min="0" inputmode="numeric" value="'+roi.m+'"><label for="roi-p">Ilova/bot qancha qismini o‘zi bajaradi, %</label><input id="roi-p" type="number" min="0" max="100" inputmode="numeric" value="'+roi.p+'"><div style="text-align:center;margin-top:16px"><div class="big-ref" style="letter-spacing:0;margin:0" id="roi-out">≈ '+roiH()+' soat / oy</div><span class="mute">tejaladigan vaqt</span></div><p class="note" style="margin:12px 0 0">Namuna hisob: o‘zingizning raqamlaringizni kiriting. Ilova ism, telefon, pasport va kishi sonini o‘zi yig‘adi, savollarga ilova javob beradi.</p></div>';
};

/* --- ARIZALAR --- */
function cardH(a){
  var open=aopen===a.ref,d=docs[a.ref]||[],h;
  h='<div class="acard'+(open?' open':'')+'"><div class="row" data-open="'+esc(a.ref)+'" style="cursor:pointer"><div><b>'+esc(shortN(a.name))+'</b><div class="mute">'+esc(a.ref)+' · '+ago(a.t)+'</div></div><span class="pill s-'+a.status+'">'+ST_L[a.status]+'</span></div>'+
  '<div class="row" style="margin-top:10px;flex-wrap:wrap"><span class="mute">'+a.people+' kishi · '+esc(a.room)+' kishilik</span><span class="mute">Hujjat '+dn(a)+'/'+DOCS.length+'</span><div class="dots" aria-label="To‘lov: '+a.paid+' / 3">'+[0,1,2].map(function(k){return '<i'+(k<a.paid?' class="on"':'')+'></i>'}).join('')+'</div></div>';
  if(open){
    var tot=due(a);
    h+='<div class="row" style="margin-top:14px"><select data-st="'+esc(a.ref)+'" aria-label="Holat">'+ST.map(function(s){return '<option value="'+s+'"'+(s===a.status?' selected':'')+'>'+ST_L[s]+'</option>'}).join('')+'</select><a class="btn sm ghost" href="tel:'+esc(a.phone.replace(/[^\d+]/g,''))+'">'+esc(a.phone)+'</a></div>'+
    '<label>To‘lovlar (bosib belgilang)</label><div class="opts">'+PAY.map(function(p,k){return '<button type="button" data-pay="'+esc(a.ref)+':'+k+'"'+(k<a.paid?' class="on"':'')+'>'+(k<2?(k+1)+'-to‘lov':'Yakuniy')+'<small>'+money(Math.round(tot*p[1]/100))+'</small></button>'}).join('')+'</div>'+
    '<label>Hujjatlar</label>'+DOCS.map(function(x,i){return '<div class="check'+(d[i]?' done':'')+'" data-adoc="'+esc(a.ref)+':'+i+'"><div class="box">'+(d[i]?'✓':'')+'</div><span>'+esc(x)+'</span></div>'}).join('')+
    (a.pass?'<p class="mute" style="margin:10px 0 0">Pasport: '+esc(a.pass)+'</p>':'')+
    '<label for="n-'+esc(a.ref)+'">Izoh</label><input id="n-'+esc(a.ref)+'" data-note="'+esc(a.ref)+'" placeholder="Masalan: 15-dekabrgacha to‘laydi" value="'+esc(a.note||'')+'">'+
    '<button class="btn ghost" style="color:var(--danger);margin-top:14px" data-del="'+esc(a.ref)+'">'+(delArm===a.ref?'Aniq o‘chiraymi? Yana bosing':'Arizani o‘chirish')+'</button>';
  }
  return h+'</div>';
}
function listH(){
  var q=aq.toLowerCase(),L=apps.filter(function(a){return (afilt==='Hammasi'||a.status===afilt)&&(!q||(a.name+a.ref+a.phone).toLowerCase().indexOf(q)>-1)});
  return L.length?L.map(cardH).join(''):'<p class="mute" style="text-align:center;margin:26px 0 8px">Ariza topilmadi</p>';
}
A.apps=function(){
  var chips=['Hammasi'].concat(ST).map(function(s){var n=s==='Hammasi'?apps.length:cnt(s);return '<button data-chip="'+s+'"'+(afilt===s?' class="on"':'')+'>'+(s==='Hammasi'?'Hammasi':ST_L[s])+' · '+n+'</button>'}).join('');
  return '<div class="row"><h2>Arizalar</h2><button class="btn sm ghost" id="a-csv">CSV</button></div>'+
  '<div style="margin-top:12px"><input id="a-q" type="search" placeholder="Ism, telefon yoki raqam bo‘yicha qidirish" value="'+esc(aq)+'" aria-label="Qidirish"></div>'+
  '<div class="chips">'+chips+'</div>'+
  '<div id="a-list">'+listH()+'</div>'+
  '<div class="card">'+(addOpen?'<h3 style="margin-bottom:12px">Qo‘lda ariza qo‘shish</h3><label for="n-name">Ism-familiya</label><input id="n-name" placeholder="Ism Familiya"><label for="n-phone">Telefon</label><input id="n-phone" type="tel" inputmode="tel" placeholder="+998 90 123 45 67"><label for="n-ppl">Kishi soni</label><input id="n-ppl" type="number" min="1" value="1" inputmode="numeric"><p class="err" id="n-err" role="alert"></p><button class="btn" id="a-add" style="margin-top:6px">Qo‘shish</button><button class="btn ghost" id="a-add-t" style="margin-top:10px">Bekor qilish</button>':'<p class="mute" style="margin:0 0 4px">Telefon yoki guruhda yozgan odamni shu yerga qo‘shib, hammasini bitta ro‘yxatda yuriting.</p><button class="btn ghost" id="a-add-t" style="margin-top:10px">+ Qo‘lda ariza qo‘shish</button>')+'</div>';
};

/* --- TO'LOVLAR --- */
A.pay=function(){
  var ac=actv(),total=ac.reduce(function(n,a){return n+due(a)},0),paid=ac.reduce(function(n,a){return n+got(a)},0),pc=total?Math.round(paid/total*100):0;
  var L=ac.slice().sort(function(a,b){return a.paid-b.paid});
  return '<div><h2>To‘lovlar</h2><p class="mute" style="margin:0 2px">Kim qancha to‘lagan, kimdan nima qolgan</p></div>'+
  '<div class="stats"><div class="stat"><b>'+money(total)+'</b><span>jami</span></div><div class="stat"><b>'+money(paid)+'</b><span>yig‘ilgan</span></div><div class="stat"><b>'+money(total-paid)+'</b><span>qoldiq</span></div></div>'+
  '<div class="card"><div class="row"><span class="mute">Yig‘ilish darajasi</span><b>'+pc+'%</b></div><div class="meter"><i style="width:'+pc+'%"></i></div></div>'+demoNote()+
  L.map(function(a){var tot=due(a);return '<div class="acard"><div class="row"><div><b>'+esc(shortN(a.name))+'</b><div class="mute">'+esc(a.ref)+' · '+a.people+' kishi</div></div><div style="text-align:right"><b>'+money(got(a))+'</b><div class="mute">/ '+money(tot)+'</div></div></div><div class="opts" style="margin-top:12px">'+PAY.map(function(p,k){return '<button type="button" data-pay="'+esc(a.ref)+':'+k+'"'+(k<a.paid?' class="on"':'')+'>'+(k<2?(k+1)+'-to‘lov':'Yakuniy')+'<small>'+money(Math.round(tot*p[1]/100))+'</small></button>'}).join('')+'</div></div>'}).join('');
};

/* --- XABAR --- */
function prevH(){var r=apps.filter(AUD[draft.aud][1])[0],nm=r?shortN(r.name):'Ziyoratchi';return esc((draft.text||'Xabar matnini yozing…').replace(/\{ism\}/g,nm)).replace(/\n/g,'<br>')}
A.msg=function(){
  var n=apps.filter(AUD[draft.aud][1]).length;
  return '<div><h2>Xabar yuborish</h2><p class="mute" style="margin:0 2px">Bir bosishda kerakli ziyoratchilarga Telegramda eslatma</p></div>'+
  '<div class="card"><label>Kimga</label><div class="chips" style="margin-top:0">'+Object.keys(AUD).map(function(k){return '<button data-aud="'+k+'"'+(draft.aud===k?' class="on"':'')+'>'+AUD[k][0]+' · '+apps.filter(AUD[k][1]).length+'</button>'}).join('')+'</div>'+
  '<label>Tayyor matnlar</label><div class="chips" style="margin-top:0">'+Object.keys(TPL).map(function(k){return '<button data-tpl="'+k+'">'+TPL[k][0]+'</button>'}).join('')+'</div>'+
  '<label for="m-text">Xabar matni (<code>{ism}</code> — ziyoratchi ismi)</label><textarea id="m-text" placeholder="Xabar matnini yozing yoki tayyor matnni tanlang">'+esc(draft.text)+'</textarea>'+
  '<label>Ziyoratchi shunday ko‘radi</label><div class="tgmsg" id="m-prev" style="margin-top:0">'+prevH()+'</div>'+
  '<button class="btn" id="m-send">'+n+' kishiga yuborish (demo)</button><p class="note" style="margin:10px 0 0">Demo: xabar haqiqatda yuborilmaydi. To‘liq versiyada bot har bir ziyoratchiga Telegramda yuboradi.</p></div>'+
  (logs.length?'<div class="sec"><h3>Yuborilganlar</h3></div><div class="card" style="margin-top:10px">'+logs.map(function(x){return '<div class="app"><div class="row"><b>'+esc(x.aud)+' · '+x.n+' kishi</b><span class="mute">'+ago(x.t)+'</span></div><div class="mute" style="margin-top:4px">'+esc(x.text.slice(0,110))+(x.text.length>110?'…':'')+'</div></div>'}).join('')+'</div>':'');
};

/* --- SOZLAMA --- */
A.set=function(){
  return '<div><h2>Sozlama</h2><p class="mute" style="margin:0 2px">Reys, narx va demo ma’lumot</p></div>'+
  '<div class="card"><label for="a-cap">Jami joylar</label><input id="a-cap" type="number" min="1" inputmode="numeric" value="'+cfg.capacity+'"><label for="a-price">Narx (USD, 1 kishi)</label><input id="a-price" type="number" min="0" inputmode="numeric" placeholder="Masalan: 1500" value="'+(cfg.price||'')+'"><button class="btn" id="a-save">Saqlash</button></div>'+
  '<div class="sec"><h3>To‘liq versiyada</h3></div><div class="card" style="margin-top:10px"><ul class="list"><li>Yangi ariza tushishi bilan Telegramda sizga xabar</li><li>Ziyoratchilarga avtomatik eslatmalar: to‘lov, hujjat, jo‘nash</li><li>Hamma arizalar bulutli bazada, bir nechta xodim bilan birga ishlash</li><li>Sizning logotip, rasmlar, narxlar va haqiqiy namoz vaqtlari</li><li>Savol-javob: viza, hujjat, narx bo‘yicha tez-tez so‘raladigan savollarga avto-javob</li></ul></div>'+
  '<button class="btn ghost" id="a-reset">Demo ma’lumotni tiklash</button>';
};

R.admin=function(){var f=A[atab]||A.dash;$('#v-admin').innerHTML=f();syncNavA()};
function syncNavA(){
  $$('#nav-a button').forEach(function(b){b.classList.toggle('on',b.dataset.at===atab)});
  var n=cnt('Yangi'),b=$('#bd-apps');if(b){b.textContent=n;b.style.display=n?'grid':'none'}
}
function act(s){
  var p=s.split(':');
  if(p[0]==='apps'){atab='apps';afilt=p[1]||'Hammasi';aq='';aopen=null}
  else if(p[0]==='msg'){atab='msg';draft.aud=p[1]||'all';draft.text=TPL[p[1]==='due'?'pay':p[1]==='docs'?'docs':'dep'][1]}
  else atab=p[0];
  store.set('atab',atab);R.admin();window.scrollTo(0,0);
}
function setMode(m,focus){
  mode=m;document.body.classList.toggle('adm',m==='admin');
  $$('.mode button').forEach(function(b){b.classList.toggle('on',b.dataset.mode===m)});
  $('.brand small').textContent=m==='admin'?'Agent paneli':'Umra ziyorati';
  if(m==='admin'){
    if(focus&&me){atab='apps';afilt='Hammasi';aq='';aopen=me}
    view='admin';R.admin();
    $$('.view').forEach(function(s){s.classList.toggle('on',s.id==='v-admin')});
    window.scrollTo(0,0);syncTg();
  }else go('home');
}
function exportCsv(){
  var g=function(v){v=String(v);return /^[=+\-@]/.test(v)?"'"+v:v};
  var rows=[['ref','ism','telefon','pasport','kishi','xona','holat','tolov (3 dan)','hujjat (4 dan)','izoh']].concat(apps.map(function(a){return [a.ref,a.name,a.phone,a.pass||'',a.people,a.room,ST_L[a.status],a.paid,dn(a),a.note||'']}));
  var csv=rows.map(function(r){return r.map(function(v){return '"'+g(v).replace(/"/g,'""')+'"'}).join(',')}).join('\n');
  var url=URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv'})),l=document.createElement('a');l.href=url;l.download='umra-arizalar.csv';document.body.appendChild(l);l.click();l.remove();setTimeout(function(){URL.revokeObjectURL(url)},1000);
}
$('#v-admin').addEventListener('click',function(e){
  var t=e.target,x;
  if((x=t.closest('[data-open]'))){aopen=aopen===x.dataset.open?null:x.dataset.open;delArm=null;return rer()}
  if((x=t.closest('[data-chip]'))){afilt=x.dataset.chip;aopen=null;return rer()}
  if((x=t.closest('[data-pay]'))){var p=x.dataset.pay.split(':'),a=byRef(p[0]),k=+p[1]+1;if(a){a.paid=a.paid===k?k-1:k;save();hap('light')}return rer()}
  if((x=t.closest('[data-adoc]'))){var q=x.dataset.adoc.split(':'),d=docs[q[0]]||DOCS.map(function(){return false});d[+q[1]]=!d[+q[1]];docs[q[0]]=d;save();hap('light');return rer()}
  if((x=t.closest('[data-del]'))){
    if(delArm===x.dataset.del){apps=apps.filter(function(a){return a.ref!==x.dataset.del});if(me===x.dataset.del)me=null;save();delArm=null;aopen=null;toast('O‘chirildi')}else delArm=x.dataset.del;
    return rer();
  }
  if((x=t.closest('[data-act]')))return act(x.dataset.act);
  if((x=t.closest('[data-aud]'))){draft.aud=x.dataset.aud;return rer()}
  if((x=t.closest('[data-tpl]'))){draft.text=TPL[x.dataset.tpl][1];hap('light');return rer()}
  var id=(t.closest('button')||{}).id;
  if(id==='a-csv')return exportCsv();
  if(id==='a-add-t'){addOpen=!addOpen;return rer()}
  if(id==='a-add'){
    var nm=$('#n-name').value.trim(),ph=$('#n-phone').value.trim(),pp=parseInt($('#n-ppl').value,10)||0,er=$('#n-err');
    if(nm.length<3){er.textContent='Ism-familiyani kiriting';return}
    if(ph.replace(/\D/g,'').length<9){er.textContent='Telefon raqamini to‘g‘ri kiriting';return}
    if(pp<1||pp>left()){er.textContent='Joy yetarli emas ('+left()+' ta bo‘sh)';return}
    var na={ref:'IH-'+(1000+Math.floor(Math.random()*9000)),name:nm,phone:ph,pass:'',people:pp,room:pp>=4?'4':pp===3?'3':'2',status:'Yangi',paid:0,note:'',t:Date.now()};
    apps.unshift(na);save();addOpen=false;aopen=na.ref;hap('ok');toast('Ariza qo‘shildi');return rer();
  }
  if(id==='m-send'){
    var rc=apps.filter(AUD[draft.aud][1]);
    if(draft.text.trim().length<5){toast('Xabar matnini yozing');return}
    if(!rc.length){toast('Bu guruhda hech kim yo‘q');return}
    logs.unshift({t:Date.now(),aud:AUD[draft.aud][0],n:rc.length,text:draft.text});logs=logs.slice(0,10);store.set('log',logs);
    draft.text='';hap('ok');toast(rc.length+' kishiga yuboriladi (demo)');return rer();
  }
  if(id==='a-save'){var c=parseInt($('#a-cap').value,10),pr=parseInt($('#a-price').value,10);if(!(c>0)){toast('Joylar sonini kiriting');return}cfg.capacity=c;cfg.price=pr>0?pr:0;save();rer();toast('Saqlandi');return}
  if(id==='a-reset'){var s=initSeed();apps=s.apps;docs=s.docs;cfg={capacity:40,price:0};me=null;logs=[];store.set('log',logs);save();aopen=null;afilt='Hammasi';rer();toast('Demo tiklandi')}
});
$('#v-admin').addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='a-q'){aq=t.value;$('#a-list').innerHTML=listH();return}
  if(t.id==='m-text'){draft.text=t.value;$('#m-prev').innerHTML=prevH();return}
  if(t.id==='roi-w'||t.id==='roi-m'||t.id==='roi-p'){
    var k=t.id.slice(4),v=parseFloat(t.value);roi[k]=v>0?(k==='p'?Math.min(100,v):v):0;store.set('roi',roi);$('#roi-out').textContent='≈ '+roiH()+' soat / oy';
  }
});
$('#v-admin').addEventListener('change',function(e){
  var s=e.target.closest('[data-st]'),n=e.target.closest('[data-note]');
  if(s){var a=byRef(s.dataset.st);if(a){a.status=s.value;save();rer()}}
  if(n){var b=byRef(n.dataset.note);if(b){b.note=n.value.trim();save()}}
});
$('#nav-a').addEventListener('click',function(e){
  var b=e.target.closest('[data-at]');if(!b)return;
  atab=b.dataset.at;store.set('atab',atab);aopen=null;delArm=null;hap('light');R.admin();window.scrollTo(0,0);
});

/* ---------- Telegram Mini App rejimi ---------- */
function syncTg(){
  if(!tg)return;
  var on=view==='book'&&!bk.done;
  document.body.classList.toggle('mb-on',on);
  try{
    if(on){tg.MainButton.setParams({text:bkLabel(),color:'#0E7C61',text_color:'#FFFFFF',is_visible:true})}else tg.MainButton.hide();
    if(view==='home')tg.BackButton.hide();else tg.BackButton.show();
  }catch(e){}
}
function initTelegram(){
  if(!/tgWebAppData|tgWebAppPlatform/.test(location.hash+location.search))return;
  var s=document.createElement('script');s.src='https://telegram.org/js/telegram-web-app.js';
  s.onload=function(){
    tg=window.Telegram&&window.Telegram.WebApp;if(!tg)return;
    tg.ready();tg.expand();document.body.classList.add('in-tg');
    applyTheme(autoTheme());
    tg.onEvent('themeChanged',function(){applyTheme(autoTheme())});
    tg.MainButton.onClick(bkNext);
    tg.BackButton.onClick(function(){if(view==='book')bkBack();else if(view==='admin')setMode('user');else go('home')});
    syncTg();
  };
  document.head.appendChild(s);
}

applyTheme(autoTheme());R.home();initTelegram();
})();
</script>
